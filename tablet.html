<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BKS Trainingsplan · Tablet</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3D4BA7">
<link rel="icon" href="app/icon-logo-180.png">
<link rel="stylesheet" href="app/schriften.css">
<style>
/* ===================================================================
   BKS Bewegungszentrum — Trainingsplan am Tablet
   Fassung 17.10.2026

   Fuer die Geraeteeinweisung am Android-Tablet: Plan im Stehen
   eintippen, Skizzen mit Stift oder Finger zeichnen. Danach:
   - Mehrere Plaene je Mitglied (Splits, z. B. Oberkoerper/Unterkoerper):
     Feld "Plan" fuer den Namen, "Weiterer Plan" legt den naechsten mit
     gleichem Mitgliedsnamen an. Jeder Plan hat eigene Fassungen und
     einen eigenen QR-Code; das Handy schaltet zwischen ihnen um.
     Im QR-Dialog "Alle ... Plaene in einem Code": bei der Einweisung
     reicht dann ein Scan und das iPhone bekommt nur ein Symbol.
   - "Speichern": legt den Plan auf diesem Tablet ab (Planliste).
     Beim Check-up: "Plaene" -> Name suchen -> oeffnen -> aendern ->
     speichern. Mit neuem Datum entsteht eine neue Fassung, die alte
     bleibt. Am selben Tag wird die Fassung ueberschrieben.
   - "QR-Code fuers Handy": das Mitglied scannt noch am Geraet.
   - "Drucken / PDF": oeffnet die A4-Vorlage mit dem Plan und den
     Druckdialog.

   Kein PC, kein OneDrive (Nils, 16.10.2026: der Team-PC ist bewusst
   nicht mit OneDrive verbunden). Die Plaene liegen nur im Speicher
   des Browsers auf diesem Tablet. Wer die Browserdaten loescht oder
   das Tablet verliert, verliert sie - deshalb "Alle Plaene sichern"
   (eine Datei) und die Erinnerung nach 30 Tagen ohne Sicherung.
   Der Speicher haengt an der Adresse der Seite: nach einem Umzug auf
   eine andere Adresse die Sicherung dort wieder einspielen.

   Handschriftlich bleibt der Normalfall fuer alle, die kein Handy
   nutzen wollen (Nils, 16.10.2026: aeltere Mitglieder) - dafuer gibt
   es weiter die leere Vorlage zum Ausdrucken.

   Eine Liste fuer alle Uebungen (seit 17.10.2026, Wunsch Nils): Jede
   Uebung beginnt mit der Kategorie (Cardio, Geraet, Koordination,
   Freie Uebung), danach richten sich die Felder. Am Griff laesst sie
   sich an jede Stelle ziehen, auch eine Freie Uebung vor ein Geraet.
   Diese Reihenfolge bekommt das Handy (o im Plan, siehe kern.js).
   Der A4-Ausdruck hat feste Tabellen je Kategorie und bleibt danach
   sortiert. Deshalb gilt je Kategorie weiter die Zeilenzahl des
   Ausdrucks (Cardio 4, Geraete 8, Koordination 5, Freie Uebungen 6),
   damit der Plan auf zwei Seiten passt.

   Der Entwurf, an dem gerade gearbeitet wird, liegt zusaetzlich im
   Sitzungsspeicher dieses Tabs: Ein versehentliches Neuladen verliert
   nichts.
   =================================================================== */
:root{
  --indigo:#3D4BA7; --hellblau:#5894D5; --tinte:#12141c; --text2:#3a3f4c; --grau:#6a7080;
  --linie:#dfe3ec; --feld:#eef2fa; --grund:#f4f6fb; --weiss:#fff;
}
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html{ background:var(--grund); }
body{ font-family:'Inter',system-ui,sans-serif; color:var(--tinte); font-size:17px; line-height:1.4;
  max-width:980px; margin:0 auto; padding:0 20px 120px; font-synthesis:none; }
.serif{ font-family:'Instrument Serif',Georgia,serif; font-style:italic; font-weight:400; color:var(--indigo); letter-spacing:-.01em; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
input, textarea{ font:inherit; color:inherit; }

.kopf{ display:flex; align-items:center; gap:22px; padding:22px 0 10px; }
.kopf img{ height:40px; display:block; }
.kopf h1{ font-size:30px; font-weight:300; letter-spacing:-.03em; }
.kopf h1 .serif{ font-size:35px; }
.kopf .stand{ margin-left:auto; font-size:14px; color:var(--grau); text-align:right; }
.kopf .stand b{ color:var(--tinte); font-weight:600; }

label{ display:block; font-size:13px; font-weight:600; color:var(--grau); letter-spacing:.02em; }
label input, label textarea{ display:block; width:100%; margin-top:5px; border:1.5px solid var(--linie); border-radius:10px;
  background:#fff; padding:10px 12px; font-size:18px; font-weight:400; color:var(--tinte); letter-spacing:0; }
label input{ height:50px; }
label textarea{ resize:vertical; min-height:74px; line-height:1.4; }
label input:focus, label textarea:focus{ outline:0; border-color:var(--indigo); box-shadow:0 0 0 3px rgba(61,75,167,.12); }

.person{ display:grid; grid-template-columns:1.6fr 1.2fr 1fr 1.3fr; gap:14px; background:#fff; border-radius:16px; padding:16px;
  box-shadow:0 1px 2px rgba(18,20,28,.06); }

.liste-kopf{ display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 12px; margin:28px 0 10px; }
.liste-kopf h2{ font-size:14px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--grau); }
.liste-kopf small{ margin-left:auto; font-size:13px; color:var(--grau); }
.a-c, .a-k{ --akzent:var(--hellblau); }
.a-g, .a-f{ --akzent:var(--indigo); }

.karte{ background:#fff; border-radius:16px; padding:14px 16px 16px 18px; margin-bottom:12px; border-left:5px solid var(--akzent);
  box-shadow:0 1px 2px rgba(18,20,28,.06); display:grid; gap:12px; transition:transform .15s ease; }
/* Kategorie zuerst: danach richten sich die Felder der Karte */
.k-oben{ display:flex; align-items:center; gap:12px; }
.kat{ display:flex; flex-wrap:wrap; gap:4px; background:var(--grund); border-radius:12px; padding:4px; }
.kat button{ height:42px; padding:0 14px; border-radius:9px; font-size:15px; font-weight:600; color:var(--text2); }
.kat button.an{ background:var(--indigo); color:#fff; box-shadow:0 1px 2px rgba(18,20,28,.15); }
.kat button:disabled{ color:#b6bbc7; cursor:not-allowed; }
/* Reihenfolge per Ziehen am Griff (touch-action:none, sonst scrollt die Seite statt zu ziehen) */
.griff{ margin-left:auto; display:inline-flex; align-items:center; gap:6px; height:42px; padding:0 12px; border-radius:10px;
  color:var(--grau); font-size:15px; font-weight:500; touch-action:none; user-select:none; -webkit-user-select:none; cursor:grab; }
.griff svg{ width:22px; height:22px; fill:currentColor; }
.karte.zieht{ transition:none; position:relative; z-index:6; box-shadow:0 16px 40px rgba(18,20,28,.25); }
body.zieht-gerade{ user-select:none; -webkit-user-select:none; }
.k-kopf{ display:flex; gap:12px; align-items:flex-end; }
.k-kopf label{ flex:1; }
.k-kopf input{ font-weight:600; }
.weg{ height:50px; padding:0 14px; color:#b3261e; font-size:15px; border-radius:10px; }
.k-werte{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; }
.k-werte input{ text-align:center; font-variant-numeric:tabular-nums; }

.k-skizze .lbl{ display:block; font-size:13px; font-weight:600; color:var(--grau); margin-bottom:5px; }
.zf{ width:100%; max-width:620px; aspect-ratio:256 / 121; border:1.5px solid var(--linie); border-radius:12px; overflow:hidden;
  background-color:#fff; background-image:radial-gradient(circle, #c3c9d6 1px, transparent 1.4px); background-size:18px 18px; background-position:center;
  cursor:crosshair; }
.zf-knoepfe{ display:flex; gap:10px; margin-top:8px; }
.zf-knoepfe button{ background:var(--feld); color:var(--indigo); border-radius:10px; padding:9px 14px; font-size:15px; font-weight:600; }

.dazu-zeile{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; border:1.5px dashed #c4c9d6; border-radius:14px; padding:12px 14px; }
.dazu-zeile > span{ color:var(--grau); font-size:15px; font-weight:600; margin-right:4px; }
.dazu-zeile button{ height:46px; padding:0 16px; border-radius:10px; background:var(--feld); color:var(--indigo); font-weight:600; }
.dazu-zeile button:disabled{ color:#b6bbc7; background:var(--grund); cursor:not-allowed; }
.voll{ color:var(--grau); font-size:14px; padding:8px 2px 0; }

/* Untere Leiste */
.leiste{ position:fixed; left:0; right:0; bottom:0; background:rgba(255,255,255,.97); border-top:1px solid var(--linie);
  padding:12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); z-index:5; }
.leiste-innen{ max-width:980px; margin:0 auto; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.leiste button{ height:52px; padding:0 18px; border-radius:12px; font-weight:600; font-size:16px; background:var(--feld); color:var(--indigo); }
.leiste .leise{ background:none; color:var(--grau); padding:0 10px; }
.leiste .abstand{ flex:1; }
.leiste .haupt{ background:var(--indigo); color:#fff; }
.leiste .ungesichert::after{ content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:#e8833a; margin-left:8px; vertical-align:middle; }

/* Dialoge */
.dialog{ position:fixed; inset:0; background:rgba(18,20,28,.5); z-index:10; display:none; align-items:center; justify-content:center; padding:20px; }
.dialog.offen{ display:flex; }
.d-inhalt{ background:#fff; border-radius:18px; padding:24px 26px; width:620px; max-width:100%; max-height:100%; overflow:auto; color:var(--text2); }
.d-inhalt h2{ font-size:26px; font-weight:300; letter-spacing:-.02em; color:var(--tinte); margin-bottom:8px; }
.d-inhalt h2 .serif{ font-size:30px; }
.qr{ width:min(460px, 100%); margin:14px auto 4px; }
.qr svg{ display:block; width:100%; height:auto; }
.klein{ font-size:14px; color:var(--grau); }
.warn{ background:#fff4e5; color:#8a4b00; border-radius:10px; padding:10px 12px; margin:10px 0; font-size:15px; }
.d-knoepfe{ display:flex; flex-wrap:wrap; gap:10px; margin-top:18px; }
.d-knoepfe button{ height:50px; padding:0 18px; border-radius:12px; font-weight:600; background:var(--feld); color:var(--indigo); }
.d-knoepfe .haupt{ background:var(--indigo); color:#fff; }

/* Planliste */
#d-plaene .d-inhalt{ width:760px; height:min(860px, 100%); display:flex; flex-direction:column; }
.such{ margin-top:6px; }
.bib{ list-style:none; margin-top:12px; overflow:auto; flex:1; border-top:1px solid var(--linie); }
.bib li{ border-bottom:1px solid var(--linie); padding:6px 0; display:grid; grid-template-columns:1fr auto; align-items:center; gap:4px 10px; }
.bib .eintrag{ text-align:left; padding:10px 4px; border-radius:10px; }
.bib .eintrag b{ display:block; font-size:18px; color:var(--tinte); }
.bib .eintrag span{ font-size:14px; color:var(--grau); }
.bib .eintrag:active{ background:var(--feld); }
.bib .loeschen{ color:#b3261e; font-size:14px; padding:10px 12px; }
.bib details{ grid-column:1 / -1; padding:0 4px 6px; font-size:14px; color:var(--grau); }
.bib summary{ cursor:pointer; padding:4px 0; }
.bib details button{ display:inline-block; margin:6px 8px 0 0; background:var(--feld); color:var(--indigo); border-radius:8px; padding:7px 12px; font-size:14px; font-weight:600; }
.bib .leer{ display:block; padding:24px 4px; color:var(--grau); }
/* Je Mitglied ein Kopf, darunter eingerueckt seine Plaene */
.bib li.mitglied{ border-bottom:0; padding:16px 4px 0; }
.bib li.mitglied b{ font-size:19px; color:var(--tinte); }
.bib .weiterer{ color:var(--indigo); font-size:14px; font-weight:600; padding:8px 12px; }
.bib li:not(.mitglied):not(.leer){ padding-left:16px; }
.bib li:not(.mitglied) .eintrag b{ font-size:17px; }
.sicherung{ margin-top:12px; padding-top:12px; border-top:1px solid var(--linie); }
.sicherung p{ font-size:14px; }
.sicherung p.alt{ color:#8a4b00; font-weight:600; }

.toast{ position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(16px); opacity:0; background:var(--tinte); color:#fff;
  border-radius:12px; padding:12px 18px; font-size:16px; max-width:calc(100% - 40px); transition:opacity .2s, transform .2s; z-index:20; pointer-events:none; }
.toast.an{ opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-width:640px){
  .person{ grid-template-columns:1fr 1fr; }
  .k-werte{ grid-template-columns:repeat(2, 1fr); }
}
</style>
</head>
<body>

<header class="kopf">
  <img src="app/logo.png" alt="Bewegungszentrum für Körperwohl und Squash">
  <h1>Ihr <span class="serif">Trainingsplan</span></h1>
  <p class="stand" id="stand"></p>
</header>

<section class="person">
  <label>Name<input id="p-name" autocomplete="off"></label>
  <label>Plan<input id="p-plan" autocomplete="off" placeholder="z. B. Oberkörper"></label>
  <label>Erstellt am<input id="p-datum" autocomplete="off"></label>
  <label>Erstellt von<input id="p-betreuer" autocomplete="off"></label>
</section>

<div id="uebungen"></div>

<nav class="leiste"><div class="leiste-innen">
  <button data-aktion="plaene">Pläne</button>
  <button class="leise" data-aktion="neu">Neuer Plan</button>
  <button class="leise" data-aktion="weiterer">Weiterer Plan</button>
  <span class="abstand"></span>
  <button id="b-speichern" data-aktion="speichern">Speichern</button>
  <button data-aktion="drucken">Drucken / PDF</button>
  <button class="haupt" data-aktion="qr">QR-Code fürs Handy</button>
</div></nav>
<input type="file" id="datei" accept=".txt,.json,.html,text/plain,application/json,text/html" hidden>

<div class="dialog" id="d-qr"><div class="d-inhalt">
  <h2>Plan <span class="serif">fürs Handy</span></h2>
  <p class="warn" id="qr-warnung" hidden>Die Handy-Seite ist noch nicht online. Der Code führt erst nach dem Veröffentlichen zum Plan.</p>
  <p>Das Mitglied öffnet die Kamera am Handy und richtet sie auf den Code.</p>
  <div class="qr" id="qr"></div>
  <p class="klein" id="qr-info"></p>
  <div class="d-knoepfe">
    <button class="haupt" data-aktion="teilen">Link teilen (z. B. WhatsApp)</button>
    <button data-aktion="qr-alle" id="b-qr-alle" hidden></button>
    <button data-aktion="zu">Schließen</button>
  </div>
  <p class="klein" style="margin-top:14px">Der Plan steckt im Code selbst. Es wird nichts hochgeladen.</p>
</div></div>

<div class="dialog" id="d-plaene"><div class="d-inhalt">
  <h2>Pläne <span class="serif">auf diesem Tablet</span></h2>
  <label class="such">Name suchen<input id="such" type="search" autocomplete="off"></label>
  <ul class="bib" id="bib"></ul>
  <div class="sicherung">
    <p id="sicherung-stand"></p>
    <div class="d-knoepfe" style="margin-top:10px">
      <button class="haupt" data-aktion="alle-sichern">Alle Pläne sichern</button>
      <button data-aktion="einspielen">Sicherung einspielen</button>
      <button data-aktion="zu">Schließen</button>
    </div>
  </div>
</div></div>

<div class="toast" id="toast"></div>

<script src="kern.js?v=b181102273"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
// max: Zeilen dieser Kategorie im A4-Ausdruck
const ABSCHNITTE = [
  { s:'c', titel:'Cardio',        eine:'Cardio',       max:4, felder:['serien', 'dauer'] },
  { s:'g', titel:'Geräte',        eine:'Gerät',        max:8, felder:['serien', 'dauer', 'pause', 'kg'] },
  { s:'k', titel:'Koordination',  eine:'Koordination', max:5, felder:['serien', 'dauer'] },
  { s:'f', titel:'Freie Übungen', eine:'Freie Übung',  max:6, felder:['serien', 'dauer', 'pause', 'kg'], skizze:true },
];
const BEREICH = Object.fromEntries(ABSCHNITTE.map(a => [a.s, a]));
const GRIFF = '<svg viewBox="0 0 24 24"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>';
const LABEL = { serien:['Serien', 'numeric'], dauer:['Wdh / Dauer', 'text'], pause:['Pause', 'text'], kg:['Gewicht (kg)', 'decimal'] };
// Feld "dauer" je Bereich: Cardio nur Minuten, Geraete und Freie Uebungen nur Wdh, Koordination beides (Nils, 17.10.2026)
const feldLabel = (s, f) => f !== 'dauer' ? LABEL[f][0] : s === 'c' ? 'Dauer (Min)' : s === 'k' ? 'Wdh / Dauer' : 'Wdh';
const REIHE = ['name', 'serien', 'dauer', 'pause', 'kg', 'notiz', 'skizze'];   // Reihenfolge im gepackten Plan
const ENTWURF = 'bks-tablet-entwurf', BETREUER = 'bks-tablet-betreuer';
const BIB = 'bks-tablet-plaene', GESICHERT = 'bks-tablet-gesichert';
const ERINNERN_TAGE = 30;

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, ' ').trim();
const holen = (sp, k) => { try { return sp.getItem(k); } catch (e) { return null; } };
const ablegen = (sp, k, v) => { try { v == null ? sp.removeItem(k) : sp.setItem(k, v); return true; } catch (e) { return false; } };
const neueId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
let toastZeit;
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('an'); clearTimeout(toastZeit); toastZeit = setTimeout(() => el.classList.remove('an'), 4000); }

/* plan.u: alle Uebungen in einer Liste, in der Reihenfolge des Plans; s = Kategorie (c, g, k, f) */
const leereZeile = s => Object.assign({ s }, Object.fromEntries(REIHE.map(f => [f, ''])));
const leererPlan = () => ({ id:null, n:'', p:'', d: Kern.heute(), b: holen(localStorage, BETREUER) || '', u:[] });
// Entwurf aus der Fassung vor dem 17.10.2026 (Uebungen nach Kategorie getrennt in plan.x)
function aufListe(p){
  if (!p.u) { p.u = []; ABSCHNITTE.forEach(a => ((p.x || {})[a.s] || []).forEach(z => p.u.push(Object.assign({}, z, { s: a.s })))); delete p.x; }
  return p;
}
let plan = leererPlan();
let geaendert = false;   // seit dem letzten Speichern veraendert?
const zahlIn = s => plan.u.filter(z => z.s === s).length;
const voll = s => zahlIn(s) >= BEREICH[s].max;

/* ---------- Anzeige ---------- */
function karteHtml(z, i){
  const a = BEREICH[z.s];
  const at = f => 'data-i="' + i + '" data-f="' + f + '"';
  const ziel = 'data-i="' + i + '"';
  return '<article class="karte a-' + z.s + '">' +
    // Kategorie zuerst. Ist eine im Ausdruck schon voll, laesst sie sich nicht waehlen.
    '<div class="k-oben"><div class="kat" role="radiogroup" aria-label="Kategorie">' + ABSCHNITTE.map(b => {
      const an = b.s === z.s, zu = !an && voll(b.s);
      return '<button role="radio" aria-checked="' + an + '"' + (an ? ' class="an"' : '') + ' data-aktion="kat" data-k="' + b.s + '" ' + ziel +
        (zu ? ' disabled title="Alle ' + b.max + ' Zeilen für ' + b.titel + ' im Ausdruck belegt"' : '') + '>' + b.eine + '</button>';
    }).join('') + '</div>' +
    (plan.u.length > 1 ? '<span class="griff" data-griff="' + i + '" aria-label="Übung verschieben">' + GRIFF + 'Verschieben</span>' : '') + '</div>' +
    '<div class="k-kopf"><label>Übung / Gerät<input ' + at('name') + ' value="' + esc(z.name) + '" autocomplete="off" enterkeyhint="next"></label>' +
    '<button class="weg" data-aktion="weg" ' + ziel + '>Entfernen</button></div>' +
    '<div class="k-werte">' + a.felder.map(f => '<label>' + feldLabel(a.s, f) + '<input ' + at(f) + ' inputmode="' + LABEL[f][1] + '" value="' + esc(z[f]) + '" autocomplete="off"></label>').join('') + '</div>' +
    '<label>Hinweis<textarea ' + at('notiz') + ' rows="2">' + esc(z.notiz) + '</textarea></label>' +
    (a.skizze ? '<div class="k-skizze"><span class="lbl">Skizze (mit Stift oder Finger)</span><div class="zf" ' + ziel + '></div>' +
      '<div class="zf-knoepfe"><button data-aktion="rueck" ' + ziel + '>Rückgängig</button><button data-aktion="leeren" ' + ziel + '>Skizze löschen</button></div></div>' : '') +
    '</article>';
}
function zeichne(){
  $('#p-name').value = plan.n; $('#p-plan').value = plan.p || ''; $('#p-datum').value = plan.d; $('#p-betreuer').value = plan.b;
  const volle = ABSCHNITTE.filter(a => voll(a.s));
  $('#uebungen').innerHTML =
    '<div class="liste-kopf"><h2>Übungen</h2><small>Platz im Ausdruck: ' + ABSCHNITTE.map(a => a.titel + ' ' + zahlIn(a.s) + ' von ' + a.max).join(' · ') + '</small></div>' +
    plan.u.map(karteHtml).join('') +
    '<div class="dazu-zeile"><span>Übung hinzufügen:</span>' + ABSCHNITTE.map(a =>
      '<button data-aktion="dazu" data-k="' + a.s + '"' + (voll(a.s) ? ' disabled' : '') + '>+ ' + a.eine + '</button>').join('') + '</div>' +
    (volle.length ? '<p class="voll">' + volle.map(a => a.titel).join(', ') + ': alle Zeilen belegt. Mehr passt nicht auf den Ausdruck.</p>' : '');
  document.querySelectorAll('.zf').forEach(el => {
    const zeile = plan.u[+el.dataset.i];
    el.feld = Kern.Zeichenfeld(el, () => { zeile.skizze = el.feld.wert; merken(true); });
    el.feld.wert = zeile.skizze;
  });
  standZeigen();
}
function standZeigen(){
  const e = plan.id && bibLaden().plaene.find(x => x.id === plan.id);
  $('#stand').innerHTML = e ? 'Auf dem Tablet gespeichert' + (e.p ? ' · ' + esc(e.p) : '') + '<br><b>' + (geaendert ? 'mit ungespeicherten Änderungen' : 'Stand ' + esc(letzte(e).d)) + '</b>'
                            : (geaendert ? '<b>Noch nicht gespeichert</b>' : '');
  $('#b-speichern').classList.toggle('ungesichert', geaendert);
}

/* ---------- Entwurf: nur fuer diesen Tab, uebersteht ein Neuladen ---------- */
function merken(veraendert){
  if (veraendert) { geaendert = true; standZeigen(); }
  ablegen(sessionStorage, ENTWURF, JSON.stringify({ plan, geaendert }));
}
addEventListener('beforeunload', e => { if (geaendert) { e.preventDefault(); e.returnValue = ''; } });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) plan.u[+t.dataset.i][t.dataset.f] = t.value;
  else if (t.id === 'p-name') plan.n = t.value;
  else if (t.id === 'p-plan') plan.p = t.value;
  else if (t.id === 'p-datum') plan.d = t.value;
  else if (t.id === 'p-betreuer') { plan.b = t.value; ablegen(localStorage, BETREUER, t.value); }
  else if (t.id === 'such') { planListe(); return; }
  else return;
  merken(true);
});

/* ---------- Plan packen ---------- */
// Nur die Felder der Kategorie: Wechselt eine Uebung z. B. von Freie Uebung zu Cardio, fallen Pause, Gewicht und Skizze weg
const gehoert = (s, f) => f === 'name' || f === 'notiz' || BEREICH[s].felder.includes(f) || (f === 'skizze' && !!BEREICH[s].skizze);
function planDaten(){
  const liste = plan.u.filter(r => r.name.trim()).map(r => ({ s: r.s, z: REIHE.map(f => gehoert(r.s, f) ? String(r[f] || '').trim() : '') }));
  const { x, o } = Kern.ausReihe(liste);   // nach Kategorie fuer die A4-Tabellen, o fuer die Reihenfolge
  return { t:'plan', v:1, n: plan.n.trim(), p: (plan.p || '').trim(), d: plan.d.trim() || Kern.heute(), b: plan.b.trim(), x, o };
}
const anzahl = p => Object.values(p.x).reduce((n, z) => n + z.length, 0);
function bereit(){
  const p = planDaten();
  if (!anzahl(p)) { toast('Erst mindestens eine Übung mit Namen eintragen.'); return null; }
  const ohneName = plan.u.some(r => !r.name.trim() && REIHE.some(f => f !== 'name' && r[f]));
  if (ohneName && !confirm('Übungen ohne Namen werden weggelassen. Trotzdem weiter?')) return null;
  return p;
}
function planAus(daten){
  // Handy-Sicherung: seit den Splits mehrere Plaene (stand.plaene), genommen wird der gerade gezeigte
  const S = daten.t === 'stand' ? daten.stand : null;
  const s = S ? (S.plaene ? (S.plaene.find(x => x.key === S.aktiv) || S.plaene[0]) : S) : null, p = s ? s.plan : daten;
  const neu = { id:null, n: p.n || '', p: (s ? s.p : p.p) || '', d: s ? Kern.heute() : (p.d || Kern.heute()), b: p.b || plan.b, u:[] };
  // In der Reihenfolge des Plans (vom Handy: wie das Mitglied sie sortiert hat)
  const reihe = s ? s.ex.map(e => ({ s: e.s, z: [e.name, e.serien, e.dauer, e.pause, e.kg.length ? e.kg[e.kg.length - 1].w : '', e.notiz, e.skizze || ''] }))
                  : Kern.reihe(daten);
  const je = {}, zuviel = [];
  reihe.forEach(r => {
    if (!BEREICH[r.s]) return;
    je[r.s] = (je[r.s] || 0) + 1;
    if (je[r.s] > BEREICH[r.s].max) { zuviel.push(r.z[0]); return; }
    neu.u.push(Object.assign({ s: r.s }, Object.fromEntries(REIHE.map((f, j) => [f, r.z[j] || '']))));
  });
  if (zuviel.length) alert('Dafür reichen die Zeilen nicht: ' + zuviel.join(', '));
  return neu;
}

/* ---------- Planliste auf dem Tablet ----------
   { v:1, plaene:[ { id, n, versionen:[ { d: Datum im Plan, zeit: gespeichert um, code: gepackter Plan } ] } ] } */
function bibLaden(){ try { return JSON.parse(localStorage.getItem(BIB)) || { v:1, plaene:[] }; } catch (e) { return { v:1, plaene:[] }; } }
function bibSchreiben(bib){
  if (ablegen(localStorage, BIB, JSON.stringify(bib))) return true;
  alert('Auf dem Tablet ließ sich nicht speichern. Ist der Speicher voll oder der Inkognito-Modus an?');
  return false;
}
const letzte = e => e.versionen[e.versionen.length - 1];
// Chrome bitten, die Plaene nicht von sich aus zu loeschen, wenn der Speicher knapp wird
function dauerhaft(){ try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {} }
const tageSeit = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 864e5) : Infinity;

async function speichern(){
  const p = bereit(); if (!p) return;
  if (!p.n) { toast('Bitte zuerst den Namen eintragen.'); $('#p-name').focus(); return; }
  const bib = bibLaden();
  let e = plan.id && bib.plaene.find(x => x.id === plan.id);
  if (!e) {
    // Gleicher Name und gleicher Planname: wahrscheinlich derselbe Plan. Anderer Planname: ein weiterer Plan (Split).
    const gleich = bib.plaene.find(x => norm(x.n) === norm(p.n) && norm(x.p) === norm(p.p));
    if (gleich && confirm('Es gibt schon einen Plan für „' + gleich.n + (gleich.p ? ' · ' + gleich.p : '') + '“ (Stand ' + letzte(gleich).d + ').\n\n' +
                          'OK: als neue Fassung dazu speichern.\nAbbrechen: als eigenen Plan anlegen (andere Person mit gleichem Namen).')) e = gleich;
  }
  if (!e) { e = { id: neueId(), n: p.n, p: p.p, versionen: [] }; bib.plaene.push(e); }
  e.n = p.n; e.p = p.p;
  const v = { d: p.d, zeit: new Date().toISOString(), code: await Kern.packen(p) };
  // Gleiches Datum: diese Fassung ueberschreiben. Neues Datum (z. B. Check-up): neue Fassung, die alte bleibt.
  if (e.versionen.length && letzte(e).d === p.d) e.versionen[e.versionen.length - 1] = v; else e.versionen.push(v);
  if (!bibSchreiben(bib)) return;
  plan.id = e.id; geaendert = false; merken(); standZeigen(); dauerhaft();
  const alt = tageSeit(holen(localStorage, GESICHERT)) > ERINNERN_TAGE;
  toast('Gespeichert: ' + p.n + (p.p ? ' · ' + p.p : '') + ', Stand ' + p.d + '.' + (alt ? ' Tipp: Unter „Pläne“ mal wieder alle Pläne sichern.' : ''));
}

// Weiterer Plan (Split) fuer dasselbe Mitglied: Name und "Erstellt von" bleiben, Uebungen sind leer
function weitererPlan(name, betreuer){
  plan = leererPlan(); plan.n = name; if (betreuer) plan.b = betreuer;
  geaendert = false; merken(); zeichne(); window.scrollTo(0, 0);
  $('#d-plaene').classList.remove('offen');
  $('#p-plan').focus();
  toast('Weiterer Plan für ' + name + '. Gib ihm oben bei „Plan“ einen Namen, z. B. Unterkörper.');
}

// Liste nach Mitglied: je Mitglied ein Kopf, darunter seine Plaene (Splits) mit ihren Fassungen
function planListe(){
  const bib = bibLaden(), such = norm($('#such').value);
  const treffer = bib.plaene.filter(e => !such || norm(e.n).includes(such) || norm(e.p).includes(such));
  const gruppen = new Map();
  treffer.forEach(e => { const k = norm(e.n); if (!gruppen.has(k)) gruppen.set(k, []); gruppen.get(k).push(e); });
  const neueste = l => l.reduce((z, e) => letzte(e).zeit > z ? letzte(e).zeit : z, '');
  const liste = [...gruppen.values()].sort((a, b) => neueste(b) < neueste(a) ? -1 : 1);
  $('#bib').innerHTML = liste.length ? liste.map(plaene => {
    plaene.sort((a, b) => norm(a.p) < norm(b.p) ? -1 : 1);
    return '<li class="mitglied"><b>' + esc(plaene[0].n) + '</b>' +
      '<button class="weiterer" data-aktion="bib-weiterer" data-id="' + plaene[0].id + '">+ Weiterer Plan</button></li>' +
      plaene.map(e => {
        const n = e.versionen.length;
        return '<li><button class="eintrag" data-aktion="bib-oeffnen" data-id="' + e.id + '"><b>' + esc(e.p || 'Trainingsplan') + '</b><span>Stand ' + esc(letzte(e).d) +
            (n > 1 ? ' · ' + n + ' Fassungen' : '') + '</span></button>' +
          '<button class="loeschen" data-aktion="bib-loeschen" data-id="' + e.id + '">Löschen</button>' +
          (n > 1 ? '<details><summary>Frühere Fassungen</summary>' + e.versionen.slice(0, -1).map((v, k) =>
            '<button data-aktion="bib-oeffnen" data-id="' + e.id + '" data-v="' + k + '">Stand ' + esc(v.d) + '</button>').reverse().join('') + '</details>' : '') +
          '</li>';
      }).join('');
  }).join('') : '<li class="leer">' + (such ? 'Kein Plan mit diesem Namen.' : 'Noch keine Pläne auf diesem Tablet.') + '</li>';
  const g = holen(localStorage, GESICHERT), tage = tageSeit(g), el = $('#sicherung-stand');
  el.textContent = bib.plaene.length + (bib.plaene.length === 1 ? ' Plan' : ' Pläne') + ' auf diesem Tablet. ' +
    (g ? 'Letzte Sicherung am ' + new Date(g).toLocaleDateString('de-DE') + '.' : 'Noch nie gesichert.') +
    ' Die Pläne liegen nur hier: Wer die Browserdaten löscht oder das Tablet verliert, braucht die Sicherung.';
  el.classList.toggle('alt', bib.plaene.length > 0 && tage > ERINNERN_TAGE);
}

async function bibOeffnen(id, k){
  const e = bibLaden().plaene.find(x => x.id === id); if (!e) return;
  if (geaendert && !confirm('Der Plan auf dem Bildschirm ist nicht gespeichert. Trotzdem einen anderen öffnen?')) return;
  const v = k == null ? letzte(e) : e.versionen[k];
  try { plan = planAus(await Kern.auspacken(v.code)); } catch (err) { alert('Dieser Plan ließ sich nicht lesen.'); return; }
  plan.id = e.id;
  // Fuer die Anpassung beim Check-up: Datum von heute. Gespeichert wird erst mit "Speichern".
  plan.d = Kern.heute();
  geaendert = false; merken(); zeichne(); window.scrollTo(0, 0);
  $('#d-plaene').classList.remove('offen');
  toast('Plan vom ' + v.d + ' geöffnet. Speichern legt eine neue Fassung von heute an, die alte bleibt.');
}

/* Sicherung: alle Plaene in einer Datei. Als .txt, weil Android-Chrome .json nicht ueber das
   Teilen-Menue weitergibt. Inhalt ist JSON. */
async function alleSichern(){
  const bib = bibLaden();
  if (!bib.plaene.length) { toast('Noch keine Pläne zum Sichern.'); return; }
  const name = 'Trainingspläne Sicherung ' + Kern.heute() + '.txt';
  const datei = new File([JSON.stringify({ t:'bks-trainingsplaene', v:1, gesichert: new Date().toISOString(), plaene: bib.plaene })],
                         name, { type:'text/plain' });
  let ok = false;
  if (navigator.canShare && navigator.canShare({ files: [datei] })) {
    try { await navigator.share({ files: [datei], title: name }); ok = true; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  if (!ok) { herunterladen(datei); toast('Die Sicherung liegt in den Downloads.'); }
  ablegen(localStorage, GESICHERT, new Date().toISOString());
  planListe();
}
function herunterladen(datei){
  const a = document.createElement('a'); a.href = URL.createObjectURL(datei); a.download = datei.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
// Einspielen: fuegt Plaene und Fassungen hinzu, ueberschreibt nichts. Nimmt auch einen einzelnen Plan (Akten-Datei vom PC).
function einspielen(text){
  let daten = null; try { daten = JSON.parse(text); } catch (e) {}
  if (daten && daten.t === 'bks-trainingsplaene') {
    const bib = bibLaden(); let neuP = 0, neuV = 0;
    daten.plaene.forEach(q => {
      const e = bib.plaene.find(x => x.id === q.id);
      if (!e) { bib.plaene.push(q); neuP++; return; }
      q.versionen.forEach(v => { if (!e.versionen.some(w => w.zeit === v.zeit)) { e.versionen.push(v); neuV++; } });
      e.versionen.sort((a, b) => a.zeit < b.zeit ? -1 : 1);
    });
    if (bibSchreiben(bib)) { planListe(); toast(neuP + ' Pläne und ' + neuV + ' Fassungen dazugekommen.'); }
    return;
  }
  const code = Kern.codeAus(text);
  if (!code) { alert('In dieser Datei steckt weder eine Sicherung noch ein Trainingsplan.'); return; }
  Kern.auspacken(code).then(d => {
    if (geaendert && !confirm('Der Plan auf dem Bildschirm ist nicht gespeichert. Trotzdem öffnen?')) return;
    plan = planAus(d); geaendert = true; merken(); zeichne(); $('#d-plaene').classList.remove('offen');
    toast('Plan geöffnet. Mit „Speichern“ kommt er in die Liste.');
  }).catch(() => alert('Der Plan ließ sich nicht lesen.'));
}

/* ---------- Aktionen ---------- */
let teilLink = '';

/* Alle Plaene dieses Mitglieds: der Plan auf dem Bildschirm (auch ungespeichert) plus die
   zuletzt gespeicherte Fassung jedes anderen Plans mit gleichem Mitgliedsnamen. */
async function allePlaene(p){
  const andere = bibLaden().plaene.filter(e => norm(e.n) === norm(p.n) && e.id !== plan.id && norm(e.p) !== norm(p.p));
  const liste = [p];
  for (const e of andere) { try { liste.push(await Kern.auspacken(letzte(e).code)); } catch (err) {} }
  return liste.sort((a, b) => norm(a.p) < norm(b.p) ? -1 : 1);
}
// Mehrere Plaene in einem Code; zu lang fuer einen QR-Code -> erst ohne Skizzen
async function sammelLink(liste){
  const voll = Kern.BASIS + 'app/#p=' + await Kern.packen({ t:'plaene', v:1, liste });
  if (voll.length <= Kern.QR_MAX) return { link: voll };
  const kurz = Kern.BASIS + 'app/#p=' + await Kern.packen({ t:'plaene', v:1, liste: liste.map(Kern.ohneSkizzen) });
  return { link: kurz, lang: voll, ohneSkizzen: true };
}

let qrAlle = false;
async function qrZeigen(alle){
  const p = bereit(); if (!p) return;
  const liste = p.n && p.p ? await allePlaene(p) : [p];
  qrAlle = !!alle && liste.length > 1;
  const r = qrAlle ? await sammelLink(liste) : await Kern.handyLink(p);
  teilLink = r.lang || r.link;
  const info = qrAlle
    ? [liste.length + ' Pläne für ' + p.n + ' in einem Code: ' + liste.map(x => x.p || 'Trainingsplan').join(', ') + '.']
    : [anzahl(p) + (anzahl(p) === 1 ? ' Übung' : ' Übungen') + (p.n ? ' für ' + p.n : ', ohne Namen') + (p.p ? ' · Plan „' + p.p + '“' : '') + '.'];
  if (r.ohneSkizzen) info.push('Die Skizzen passen nicht mehr in den QR-Code. „Link teilen“ nimmt sie mit.');
  $('#qr').innerHTML = '';
  try { const q = qrcode(0, 'L'); q.addData(r.link); q.make(); $('#qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 4, scalable: true }); }
  catch (e) {
    info.push(typeof qrcode === 'undefined' ? 'Für den QR-Code fehlt die Internetverbindung.'
      : qrAlle ? 'Zusammen sind die Pläne zu lang für einen QR-Code. Bitte jeden Plan einzeln zeigen.' : 'Der Plan ist zu lang für einen QR-Code, bitte den Link teilen.');
  }
  $('#qr-info').textContent = info.join(' ');
  // Umschalten zwischen "nur dieser Plan" und "alle Plaene in einem Code", sobald es mehrere gibt
  const b = $('#b-qr-alle');
  b.hidden = liste.length < 2;
  b.textContent = qrAlle ? 'Nur diesen Plan zeigen' : 'Alle ' + liste.length + ' Pläne in einem Code';
  $('#qr-warnung').hidden = Kern.ONLINE || location.hostname === 'localhost';
  $('#d-qr').classList.add('offen');
}

document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-aktion]');
  if (ev.target.classList.contains('dialog')) { ev.target.classList.remove('offen'); return; }
  if (!t) return;
  const i = +t.dataset.i;
  switch (t.dataset.aktion) {
    case 'dazu': {
      const k = t.dataset.k; if (voll(k)) break;
      plan.u.push(leereZeile(k)); merken(true); zeichne();
      document.querySelector('input[data-i="' + (plan.u.length - 1) + '"][data-f="name"]').focus();
      break;
    }
    case 'kat': {
      const z = plan.u[i], k = t.dataset.k;
      if (z.s === k || voll(k)) break;
      // Was die neue Kategorie nicht hat, bleibt im Entwurf gemerkt (zurueckwechseln holt es wieder), kommt aber nicht in den Plan
      const weg = ['pause', 'kg', 'skizze'].filter(f => z[f] && gehoert(z.s, f) && !gehoert(k, f));
      z.s = k; merken(true); zeichne();
      if (weg.length) {
        const namen = weg.map(f => ({ pause:'Pause', kg:'Gewicht', skizze:'Skizze' }[f]));
        toast(namen.slice(0, -1).join(', ') + (namen.length > 1 ? ' und ' : '') + namen[namen.length - 1] + ' gibt es bei ' + BEREICH[k].titel +
              ' nicht. Wechselst du zurück, ist alles wieder da.');
      }
      break;
    }
    case 'weg': {
      const z = plan.u[i];
      if (REIHE.some(f => z[f]) && !confirm('„' + (z.name || 'Diese Übung') + '“ entfernen?')) break;
      plan.u.splice(i, 1); merken(true); zeichne(); break;
    }
    case 'rueck':  document.querySelector('.zf[data-i="' + i + '"]').feld.rueckgaengig(); break;
    case 'leeren': {
      const f = document.querySelector('.zf[data-i="' + i + '"]').feld;
      if (!f.leer && confirm('Skizze löschen?')) f.leeren();
      break;
    }
    case 'speichern': speichern(); break;
    case 'qr': qrZeigen(false); break;
    case 'qr-alle': qrZeigen(!qrAlle); break;
    case 'teilen':
      if (navigator.share) { try { await navigator.share({ title: 'Ihr Trainingsplan', text: 'Ihr Trainingsplan vom BKS Bewegungszentrum', url: teilLink }); } catch (e) {} }
      else { try { await navigator.clipboard.writeText(teilLink); toast('Link kopiert.'); } catch (e) { prompt('Link zum Kopieren:', teilLink); } }
      break;
    case 'drucken': {
      const p = bereit(); if (!p) break;
      window.open(Kern.ORDNER + 'trainingsplan.html#p=' + await Kern.packen(p) + '&drucken', '_blank');
      break;
    }
    case 'plaene': $('#such').value = ''; planListe(); $('#d-plaene').classList.add('offen'); break;
    case 'weiterer': {
      if (!plan.n.trim()) { toast('Erst den Namen des Mitglieds eintragen.'); $('#p-name').focus(); break; }
      // Damit das Handy die Plaene auseinanderhalten kann, braucht auch der erste einen Namen
      if (!(plan.p || '').trim()) { toast('Gib zuerst diesem Plan bei „Plan“ einen Namen, z. B. Oberkörper, und speichere ihn.'); $('#p-plan').focus(); break; }
      if (geaendert && !confirm('Dieser Plan ist nicht gespeichert. Trotzdem einen weiteren anfangen?')) break;
      weitererPlan(plan.n.trim(), plan.b);
      break;
    }
    case 'bib-weiterer': {
      const e = bibLaden().plaene.find(x => x.id === t.dataset.id); if (!e) break;
      if (geaendert && !confirm('Der Plan auf dem Bildschirm ist nicht gespeichert. Trotzdem einen weiteren anfangen?')) break;
      weitererPlan(e.n, plan.b);
      break;
    }
    case 'bib-oeffnen': bibOeffnen(t.dataset.id, t.dataset.v == null ? null : +t.dataset.v); break;
    case 'bib-loeschen': {
      const bib = bibLaden(), e = bib.plaene.find(x => x.id === t.dataset.id);
      if (!e || !confirm('Den Plan von „' + e.n + '“ mit allen ' + e.versionen.length + ' Fassungen von diesem Tablet löschen?')) break;
      bib.plaene = bib.plaene.filter(x => x !== e);
      if (bibSchreiben(bib)) { if (plan.id === e.id) plan.id = null; planListe(); standZeigen(); }
      break;
    }
    case 'alle-sichern': alleSichern(); break;
    case 'einspielen': $('#datei').click(); break;
    case 'neu': {
      if (geaendert && !confirm('Neuen Plan anfangen? Die Änderungen am aktuellen Plan sind nicht gespeichert.')) break;
      plan = leererPlan(); geaendert = false; ablegen(sessionStorage, ENTWURF, null); zeichne(); window.scrollTo(0, 0); break;
    }
    case 'zu': t.closest('.dialog').classList.remove('offen'); break;
  }
});

/* ---------- Reihenfolge per Ziehen ----------
   Wie auf dem Handy: Pointer-Events statt HTML-Drag-and-drop, gezogen wird am Griff, ueber alle
   Kategorien hinweg. Am oberen und unteren Rand scrollt die Seite mit. */
let zug = null;
document.addEventListener('pointerdown', ev => {
  const g = ev.target.closest && ev.target.closest('[data-griff]');
  if (!g || zug) return;
  ev.preventDefault();
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const karte = g.closest('.karte'), karten = [...document.querySelectorAll('#uebungen .karte')];
  const start = karten.indexOf(karte), r = karte.getBoundingClientRect();
  zug = { karte, karten, start, ziel: start, pid: ev.pointerId, y: ev.clientY, y0: ev.clientY + scrollY,
          schritt: r.height + 12, mitten: karten.map(k => { const q = k.getBoundingClientRect(); return q.top + scrollY + q.height / 2; }) };
  try { g.setPointerCapture(ev.pointerId); } catch (e) {}
  karte.classList.add('zieht'); document.body.classList.add('zieht-gerade');
  zug.timer = setInterval(randScroll, 16);
});
function zugBewegen(){
  const dy = zug.y + scrollY - zug.y0, c = zug.mitten[zug.start] + dy;
  zug.karte.style.transform = 'translateY(' + dy + 'px)';
  let ziel = zug.start;
  zug.mitten.forEach((m, i) => { if (i > zug.start && m < c) ziel = Math.max(ziel, i); if (i < zug.start && m > c) ziel = Math.min(ziel, i); });
